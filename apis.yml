name: Supponor
description: 'Supponor is a virtual advertising technology company for live sports broadcasting,
  now part of TGI Sport. Its software digitally replaces and inserts in-venue brand placements
  with real-time overlays, letting broadcasters serve region-targeted advertising across
  multiple feeds, languages, surfaces, and camera angles. Core products include AIR, an
  AI-driven virtual advertising platform for live broadcast; HUB, a pre-event suite for
  fixtures, inventory, playlists, creative and approvals; and Data Room, a post-event
  analytics platform for reporting, video storage, and performance metrics. Supponor works
  across any sport and surface with remotely deployable, all-weather technology, and is
  used by organizations including FC Bayern, the NHL, The FA, Serie A, and La Liga. Added
  to the API Evangelist network as a portfolio company of Northzone; it publishes a
  corporate and careers web presence but no public developer API surface.'
